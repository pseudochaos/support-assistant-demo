[project]
name = "support-assistant-demo"
version = "0.1.0"
description = "Teaching demo: a support assistant with RAG, structured classification and human-in-the-loop escalation on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-google-genai>=4.4,<5",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7,<2"]
openai = ["langchain-openai>=1.7,<2"]

[project.scripts]
assistant = "support_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Local Agent Server for Agent Chat UI and LangGraph Studio: uv run --group ui langgraph dev
ui = ["langgraph-cli[inmem]>=0.4.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
